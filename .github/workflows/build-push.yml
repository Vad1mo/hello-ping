name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint a GitHub OIDC token

env:
  IMAGE: c8n.io/vad1mo-github/hello-ping

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            const fs = require('fs');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/oidc.jwt`, token);

      - name: Log in to Harbor with the OIDC token (no stored registry secret)
        run: |
          docker login c8n.io -u jwt --password-stdin < "${RUNNER_TEMP}/oidc.jwt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
